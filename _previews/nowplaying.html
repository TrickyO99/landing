<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Figtree:wght@500;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:960px;height:600px;background:#0f3b30;font-family:Figtree,system-ui,sans-serif;color:#fff;position:relative;overflow:hidden}
.bgc{position:absolute;left:-120px;top:-160px;width:560px;height:560px;border-radius:50%;background:#11A24F;opacity:.35}
.cover{position:absolute;left:56px;top:56px;width:230px;height:230px;border-radius:14px;background:#C6F432;overflow:hidden}
.cover i{position:absolute;display:block;border-radius:50%}
.cover i:nth-child(1){left:-30px;top:110px;width:200px;height:200px;background:#11A24F}
.cover i:nth-child(2){left:120px;top:30px;width:70px;height:70px;background:#0B3D2E}
.t{position:absolute;left:56px;top:306px;width:300px}
.t h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.t p{margin-top:6px;font-size:18px;color:#cfe3da;font-weight:500}

.lyr div{margin-bottom:12px;color:rgba(255,255,255,.28)}
.lyr .on{color:#fff}.lyr .n1{color:rgba(255,255,255,.5)}

.modes{position:absolute;left:56px;top:430px;display:flex;gap:10px;font-size:13px;font-weight:700}

<div class="cover"><i></i><i></i></div>

<div class="modes"><span class="on">Lyrics</span><span>Up next</span><span>Sing along</span></div>
