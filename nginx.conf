# odtriki.com gateway: static pages live here, every project is reached at odtriki.com/<category>/<project>/
# Upstreams are resolved at request time (Docker DNS), so a stopped project never stops the whole site.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---- old project subdomains: send visitors (and old links) to the new address
map $host $legacy_target {
  default "";
  scatterboxd.odtriki.com            /trikinema/scatterboxd;
  scatterboxd-duo.odtriki.com        /trikinema/compare;
  compare.odtriki.com                /trikinema/compare;
  crossover.odtriki.com              /trikinema/compare;
  streaming.odtriki.com              /trikinema/streaming;
  romeoetjules.odtriki.com           /trikinema/romeoetjules;
  kinoderrn.odtriki.com              /trikarcade/kinoderrn;
  chess.odtriki.com                  /trikarcade/chess;
  legislativesmaroc2026.odtriki.com  /trikolitics/monvote;
  travel.odtriki.com                 /trikoyage/travel;
  cook.odtriki.com                   /trikitchen/cook;
  beers.odtriki.com                  /trikivre/beers;
  archive.odtriki.com                /trikarchive/archive;
  old.odtriki.com                    /trikarchive/archive;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  if ($legacy_target) {
    return 301 https://odtriki.com$legacy_target$request_uri;
  }

  # renamed category: Trikentretiens -> Trikinterview
  location ^~ /trikentretiens {
    rewrite ^/trikentretiens/?(.*)$ /trikinterview/$1 permanent;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # shared Trikorporation shell, loaded by every project on *.odtriki.com
  location /shell/ {
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  # ---- static project sites: the prefix is stripped, they use relative URLs
  location = /trikarcade/chess       { return 301 /trikarcade/chess/; }
  location = /trikitchen/cook        { return 301 /trikitchen/cook/; }
  location = /trikoyage/travel       { return 301 /trikoyage/travel/; }
  location = /trikarchive/archive    { return 301 /trikarchive/archive/; }
  location = /trikinema/romeoetjules { return 301 /trikinema/romeoetjules/; }
  location = /trikarcade/kinoderrn   { return 301 /trikarcade/kinoderrn/; }
  location = /trikivre/beers         { return 301 /trikivre/beers/; }

  location /trikarcade/chess/ {
    set $up http://chess:80;
    rewrite ^/trikarcade/chess/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_set_header Host $host;
  }
  location /trikitchen/cook/ {
    set $up http://cook:80;
    rewrite ^/trikitchen/cook/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_set_header Host $host;
  }
  location /trikoyage/travel/ {
    set $up http://travel:80;
    rewrite ^/trikoyage/travel/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_set_header Host $host;
  }
  location /trikarchive/archive/ {
    set $up http://archive:80;
    rewrite ^/trikarchive/archive/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_set_header Host $host;
  }
  location /trikinema/romeoetjules/ {
    set $up http://romeoetjules:80;
    rewrite ^/trikinema/romeoetjules/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_set_header Host $host;
  }

  # ---- Express apps: prefix stripped, the client prefixes its own API calls
  location /trikarcade/kinoderrn/ {
    set $up http://kinoderrn:3000;
    rewrite ^/trikarcade/kinoderrn/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  }
  location /trikivre/beers/ {
    set $up http://beers:3000;
    rewrite ^/trikivre/beers/(.*)$ /$1 break;
    proxy_pass $up;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  }

  # ---- Next.js apps: built with basePath, the full path is passed through
  location ~ ^/trikinema/scatterboxd(/|$) {
    set $up http://scatter:3000;
    proxy_pass $up;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location ~ ^/trikinema/compare(/|$) {
    set $up http://compare:3000;
    proxy_pass $up;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
  }
  location ~ ^/trikinema/streaming(/|$) {
    set $up http://streaming:3100;
    proxy_pass $up;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location ~ ^/trikolitics/monvote(/|$) {
    set $up http://legislatives:3000;
    proxy_pass $up;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
  }
}
