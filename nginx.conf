server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location / {
    try_files $uri $uri/ =404;
  }

  # shared Trikorporation shell, loaded by every project on *.odtriki.com
  location /shell/ {
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
}
